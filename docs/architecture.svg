<svg width="680" height="838" viewBox="0 0 680 838" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>LLM red-team lab guardrail pipeline architecture</title>
<desc>A RAG security pipeline. On the right, a company corpus is embedded into a Chroma vector database that feeds the retriever. The main request flow runs top-down: user input passes through L1 input filter and L2 risk scorer to a block-threshold gate. Blocked requests refuse and stop; allowed requests continue through the retriever, L3 context guard, the LLM, and L4 output filter to the response. A detection engine on the left observes L1, L2, the gate, and L4, logging every event regardless of enforcement.</desc>
<style>
  .t  { font-size: 14px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr    { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .leader { stroke: #9c9a92; stroke-width: 0.5; stroke-dasharray: 4 4; fill: none; }
  .teal-f   { fill: #E1F5EE; stroke: #0F6E56; }
  .purple-f { fill: #EEEDFE; stroke: #534AB7; }
  .amber-f  { fill: #FAEEDA; stroke: #854F0B; }
  .red-f    { fill: #FCEBEB; stroke: #A32D2D; }
  .gray-f   { fill: #F1EFE8; stroke: #5F5E5A; }
  .blue-f   { fill: #E6F1FB; stroke: #185FA5; }
  .teal-th   { fill: #085041; } .teal-ts   { fill: #0F6E56; }
  .purple-th { fill: #3C3489; } .purple-ts { fill: #534AB7; }
  .amber-th  { fill: #633806; } .amber-ts  { fill: #854F0B; }
  .red-th    { fill: #791F1F; } .red-ts    { fill: #A32D2D; }
  .gray-th   { fill: #2C2C2A; } .gray-ts   { fill: #5F5E5A; }
  .blue-th   { fill: #0C447C; } .blue-ts   { fill: #185FA5; }
  .legend-ts { fill: #5F5E5A; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .arr { stroke: #9c9a92; } .leader { stroke: #73726c; }
    .teal-f   { fill: #085041; stroke: #5DCAA5; }
    .purple-f { fill: #3C3489; stroke: #AFA9EC; }
    .amber-f  { fill: #633806; stroke: #EF9F27; }
    .red-f    { fill: #791F1F; stroke: #F09595; }
    .gray-f   { fill: #2C2C2A; stroke: #B4B2A9; }
    .blue-f   { fill: #0C447C; stroke: #85B7EB; }
    .teal-th{fill:#9FE1CB;} .teal-ts{fill:#5DCAA5;}
    .purple-th{fill:#CECBF6;} .purple-ts{fill:#AFA9EC;}
    .amber-th{fill:#FAC775;} .amber-ts{fill:#EF9F27;}
    .red-th{fill:#F7C1C1;} .red-ts{fill:#F09595;}
    .gray-th{fill:#D3D1C7;} .gray-ts{fill:#B4B2A9;}
    .blue-th{fill:#B5D4F4;} .blue-ts{fill:#85B7EB;}
    .legend-ts { fill: #B4B2A9; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="teal-f" x="468" y="40" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="legend-ts" x="488" y="51">L1–L4 defense layers</text>
<rect class="purple-f" x="468" y="62" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="legend-ts" x="488" y="73">Detection engine</text>
<rect class="red-f" x="468" y="84" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="legend-ts" x="488" y="95">Block / refuse</text>
<rect class="blue-f" x="468" y="106" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="legend-ts" x="488" y="117">RAG knowledge store</text>

<rect class="purple-f" x="40" y="124" width="150" height="600" rx="14" stroke-width="0.5"/>
<text class="th purple-th" x="115" y="150" text-anchor="middle" dominant-baseline="central">Detection engine</text>
<text class="ts purple-ts" x="115" y="170" text-anchor="middle" dominant-baseline="central">Always logs (JSONL)</text>
<text class="ts purple-ts" x="115" y="200" text-anchor="middle" dominant-baseline="central">Signatures +</text>
<text class="ts purple-ts" x="115" y="216" text-anchor="middle" dominant-baseline="central">heuristics +</text>
<text class="ts purple-ts" x="115" y="232" text-anchor="middle" dominant-baseline="central">semantic</text>

<line class="leader" x1="190" y1="138" x2="245" y2="138"/>
<line class="leader" x1="190" y1="224" x2="245" y2="224"/>
<line class="leader" x1="190" y1="310" x2="245" y2="310"/>
<line class="leader" x1="190" y1="686" x2="245" y2="686"/>

<rect class="gray-f" x="250" y="40" width="190" height="44" rx="8" stroke-width="0.5"/>
<text class="th gray-th" x="345" y="62" text-anchor="middle" dominant-baseline="central">User / attacker input</text>
<line x1="345" y1="84" x2="345" y2="106" class="arr" marker-end="url(#arrow)"/>

<rect class="teal-f" x="250" y="110" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-th" x="345" y="130" text-anchor="middle" dominant-baseline="central">L1 — Input filter</text>
<text class="ts teal-ts" x="345" y="148" text-anchor="middle" dominant-baseline="central">Normalize + pre-screen</text>
<line x1="345" y1="166" x2="345" y2="192" class="arr" marker-end="url(#arrow)"/>

<rect class="teal-f" x="250" y="196" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-th" x="345" y="216" text-anchor="middle" dominant-baseline="central">L2 — Risk scorer</text>
<text class="ts teal-ts" x="345" y="234" text-anchor="middle" dominant-baseline="central">Score 0–100 → severity</text>
<line x1="345" y1="252" x2="345" y2="278" class="arr" marker-end="url(#arrow)"/>

<rect class="amber-f" x="250" y="282" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th amber-th" x="345" y="302" text-anchor="middle" dominant-baseline="central">Risk ≥ block?</text>
<text class="ts amber-ts" x="345" y="320" text-anchor="middle" dominant-baseline="central">L2 threshold gate</text>

<text class="ts gray-ts" x="455" y="300" text-anchor="middle" dominant-baseline="central">yes</text>
<line x1="440" y1="310" x2="468" y2="310" class="arr" marker-end="url(#arrow)"/>
<rect class="red-f" x="470" y="282" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th red-th" x="550" y="302" text-anchor="middle" dominant-baseline="central">Refuse + log</text>
<text class="ts red-ts" x="550" y="320" text-anchor="middle" dominant-baseline="central">+ stop</text>

<text class="ts gray-ts" x="360" y="368" text-anchor="middle" dominant-baseline="central">no</text>
<line x1="345" y1="338" x2="345" y2="396" class="arr" marker-end="url(#arrow)"/>

<rect class="gray-f" x="250" y="400" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-th" x="345" y="420" text-anchor="middle" dominant-baseline="central">Retriever</text>
<text class="ts gray-ts" x="345" y="438" text-anchor="middle" dominant-baseline="central">Fetch relevant chunks</text>
<line x1="345" y1="456" x2="345" y2="482" class="arr" marker-end="url(#arrow)"/>

<rect class="blue-f" x="470" y="372" width="160" height="66" rx="8" stroke-width="0.5"/>
<text class="th blue-th" x="550" y="392" text-anchor="middle" dominant-baseline="central">Company corpus</text>
<text class="ts blue-ts" x="550" y="410" text-anchor="middle" dominant-baseline="central">Handbook, policies,</text>
<text class="ts blue-ts" x="550" y="426" text-anchor="middle" dominant-baseline="central">confidential doc</text>
<line x1="550" y1="438" x2="550" y2="454" class="arr" marker-end="url(#arrow)"/>
<rect class="blue-f" x="470" y="456" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th blue-th" x="550" y="476" text-anchor="middle" dominant-baseline="central">Chroma vector DB</text>
<text class="ts blue-ts" x="550" y="494" text-anchor="middle" dominant-baseline="central">Embedded chunks</text>
<path d="M470 484 H457 V428 H444" class="arr" marker-end="url(#arrow)"/>

<rect class="teal-f" x="250" y="486" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-th" x="345" y="506" text-anchor="middle" dominant-baseline="central">L3 — Context guard</text>
<text class="ts teal-ts" x="345" y="524" text-anchor="middle" dominant-baseline="central">Drop confidential chunks</text>
<line x1="345" y1="542" x2="345" y2="568" class="arr" marker-end="url(#arrow)"/>

<rect class="gray-f" x="250" y="572" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-th" x="345" y="592" text-anchor="middle" dominant-baseline="central">LLM</text>
<text class="ts gray-ts" x="345" y="610" text-anchor="middle" dominant-baseline="central">Hardened prompt, Ollama</text>
<line x1="345" y1="628" x2="345" y2="654" class="arr" marker-end="url(#arrow)"/>

<rect class="teal-f" x="250" y="658" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-th" x="345" y="678" text-anchor="middle" dominant-baseline="central">L4 — Output filter</text>
<text class="ts teal-ts" x="345" y="696" text-anchor="middle" dominant-baseline="central">Scan PII / secret / canary</text>
<line x1="345" y1="714" x2="345" y2="740" class="arr" marker-end="url(#arrow)"/>

<rect class="gray-f" x="250" y="744" width="190" height="44" rx="8" stroke-width="0.5"/>
<text class="th gray-th" x="345" y="766" text-anchor="middle" dominant-baseline="central">Response</text>
</svg>
